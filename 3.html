<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Light Reveal</title>
    <style>
        /* Reset and Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505; /* Deep black for maximum contrast */
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Main Container */
        .reveal-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            /* Entrance animation */
            animation: popIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* The Spinning Golden Light Ray */
        .reveal-container::before {
            content: '';
            position: absolute;
            width: 110%;
            height: 110%;
            border-radius: 50%;
            background: conic-gradient(
                transparent 0%, 
                transparent 60%, 
                #ffbf00 80%, 
                #fff8dc 95%, 
                #ffffff 100%
            );
            animation: spinLight 2s linear infinite;
            z-index: 0;
        }

        /* Ambient Golden Glow / Sparkle Area */
        .reveal-container::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                0 0 20px 5px rgba(255, 215, 0, 0.3),
                0 0 50px 10px rgba(255, 140, 0, 0.4),
                0 0 80px 15px rgba(255, 215, 0, 0.2);
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* The Image itself */
        .profile-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            /* Inner border to separate image from the light */
            border: 5px solid #050505; 
            background-color: #111;
        }

        /* Animations */
        @keyframes spinLight {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="reveal-container">
        <!-- Replace the src URL with your actual image/logo path -->
        <img src="https://picsum.photos/400/400" alt="Central Profile" class="profile-photo">
    </div>

</body>
